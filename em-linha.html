<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS em linha</title>
</head>
<body>
    <main>
        <h1>CSS Em linha</h1>
        <p>Voce pode aplicar(bomba??) um estilo <em style="color:violet;">em linha</em> para um elemento usando o atributo <code style="color:green; text-decoration: underline;">style</code></p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Cor do texto</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento</dd>
            </div>
        </dl>
    </main>
    
</body>
