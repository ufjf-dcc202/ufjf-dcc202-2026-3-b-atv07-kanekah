<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
            color:violet;
        }
        code {
            color:green;
            text-decoration: underline;
            font-family: sans-serif;
        }
        dt > code {
            background-color: black;
            color: green;
        }
    </style>
</head>
<body>
    <main>
        <h1>CSS Embutido</h1>
        <p>Voce pode aplicar(bomba??) um estilo <em>embutido</em> para um elemento usando o elemento <code>style</code> no <code>head</code></p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Cor do texto</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento</dd>
            </div>
        </dl>
    </main>
    
</body>
</html>
